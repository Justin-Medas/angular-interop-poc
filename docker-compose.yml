# `docker compose up --wait`: API :8080, Angular shell :4200, FDC3 Sail :8090. Docker is the only host dependency.
# ANTHROPIC_API_KEY / AGENT_MODEL come from the gitignored repo-root .env if present; unset means the deterministic fallback.
name: angular-interop-poc

services:
  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    ports: ["8080:8080"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-claude-sonnet-5-5}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    ports: ["4200:4200"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4200').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 60

  sail:
    build: { context: ., dockerfile: docker/sail.Dockerfile }
    ports: ["8090:8090"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/html/index.html').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 40
