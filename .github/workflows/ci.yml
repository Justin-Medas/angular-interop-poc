name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 } # gitleaks scans the full history
      - uses: actions/setup-go@v7
        with: { go-version-file: api/go.mod, cache-dependency-path: api/go.sum }
      - name: gofmt
        working-directory: api
        run: test -z "$(gofmt -l .)"
      - name: go vet
        working-directory: api
        run: go vet ./...
      # Scanners are pinned and run with `go run`, so nothing is installed globally (DECISIONS #19).
      - name: govulncheck
        working-directory: api
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: gitleaks (full history)
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner -v .
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: web dependencies
        working-directory: web
        run: npm ci
      - name: ESLint + Stylelint (import boundaries, template accessibility, token-only styles)
        working-directory: web
        run: npm run lint
      - name: lint rules fire (NFR-ARCH2, NFR-A7, NFR-DS2)
        working-directory: web
        run: npm run test:lint
  unit-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: api/go.mod, cache-dependency-path: api/go.sum }
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc }
      - run: node scripts/check-coverage.mjs
  unit-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: prettier
        run: npx prettier --check .
      - name: build shell
        run: npx ng build shell
      - name: unit tests with 100% coverage thresholds
        run: npx ng test --watch=false --coverage
