# Test pipeline for every PR and push to main (specs/testing.md §8). Jobs: lint (format, static analysis, security,
# code-documentation rules), unit-go, unit-web, e2e (ubuntu + windows), visual (pinned Playwright container). Native-quickstart smoke tests live in fresh-clone.yml.
name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 } # gitleaks scans the full history
      - uses: actions/setup-go@v7
        with: { go-version-file: api/go.mod, cache-dependency-path: api/go.sum }
      - name: gofmt
        working-directory: api
        run: test -z "$(gofmt -l .)"
      - name: go vet
        working-directory: api
        run: go vet ./...
      # Scanners are pinned and run with `go run`, so nothing is installed globally (DECISIONS #19).
      # Code documentation (NFR-C2): exported Go identifiers and packages need comments. Pinned, no global install.
      - name: revive (doc comments)
        working-directory: api
        run: go run github.com/mgechev/revive@v1.17.1 -config revive.toml ./...
      - name: govulncheck
        working-directory: api
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: gitleaks (full history)
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner -v .
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      # File headers for every covered file type (NFR-C1, NFR-C4), and a test that the checker itself works.
      - name: file header comments
        run: node scripts/check-comments.mjs && node --test scripts/check-comments.test.mjs
      - name: web dependencies
        working-directory: web
        run: npm ci
      - name: ESLint + Stylelint (import boundaries, template accessibility, token-only styles)
        working-directory: web
        run: npm run lint
      - name: lint rules fire (NFR-ARCH2, NFR-A7, NFR-DS2, NFR-C2)
        working-directory: web
        run: npm run test:lint
  unit-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: api/go.mod, cache-dependency-path: api/go.sum }
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc }
      - run: node scripts/check-coverage.mjs
      # The HTML report shows covered/uncovered lines per file; it is also what a reviewer opens from the run page.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: go-coverage
          path: api/coverage
  unit-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: prettier
        run: npx prettier --check .
      - name: build shell
        run: npx ng build shell
      - name: unit tests with 100% coverage thresholds
        run: npx ng test --watch=false --coverage
      - name: coverage summary (job summary page)
        if: ${{ !cancelled() }}
        working-directory: .
        run: node scripts/coverage-summary.mjs
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: web-coverage
          path: web/coverage
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: api/go.mod, cache-dependency-path: api/go.sum }
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: install Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright functional + axe
        run: npm run test:e2e
      # Uploaded on success too: the HTML report is the E2E record, not only a failure aid.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.os }}
          path: web/playwright-report
  # Visual snapshots (specs/testing.md §6, NFR-T1). The job runs inside the pinned Playwright image, the same one
  # `npm run test:visual` uses locally, so baselines match on every OS. scripts/visual.test.mjs fails if the tag
  # here drifts from the @playwright/test version in web/package.json.
  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      HOME: /root # Playwright documents this for container jobs
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      # The image has Node but no Go toolchain, and the suite starts the real API (mock data, SPEC §6.3 defaults).
      - uses: actions/setup-go@v7
        with: { go-version-file: api/go.mod, cache-dependency-path: api/go.sum }
      - name: image tag matches the pinned Playwright version
        working-directory: .
        run: node --test scripts/visual.test.mjs
      - run: npm ci
      - name: visual snapshots
        run: npm run test:visual:ci
      - name: how to update baselines
        if: ${{ failure() }}
        run: 'echo "::error::Visual diff. If the change is intended, run npm run test:visual:update and commit the PNGs as: test(visual): update baselines - <reason>"'
      # Diff images and the HTML report; uploaded on success too so a reviewer can open the report.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: visual-report
          path: |
            web/playwright-report
            web/test-results
