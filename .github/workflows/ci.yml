name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 } # gitleaks scans the full history
      - uses: actions/setup-go@v7
        with: { go-version-file: api/go.mod, cache-dependency-path: api/go.sum }
      - name: gofmt
        working-directory: api
        run: test -z "$(gofmt -l .)"
      - name: go vet
        working-directory: api
        run: go vet ./...
      # Scanners are pinned and run with `go run`, so nothing is installed globally (DECISIONS #19).
      - name: govulncheck
        working-directory: api
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: gitleaks (full history)
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner -v .
  unit-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: api/go.mod, cache-dependency-path: api/go.sum }
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc }
      - run: node scripts/check-coverage.mjs
