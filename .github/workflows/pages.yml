# Publishes the test reports to GitHub Pages after every merge to main (NFR-T2, NFR-T3; DECISIONS #34): Go and
# Angular coverage HTML, the Playwright E2E report, and a landing page with the numbers. ci.yml remains the
# gate; this workflow only makes the results browsable, so its E2E step is allowed to fail without blocking a deploy.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: pages
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: api/go.mod, cache-dependency-path: api/go.sum }
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Go coverage report
        run: node scripts/check-coverage.mjs
      - name: web dependencies
        working-directory: web
        run: npm ci
      - name: Angular coverage reports
        working-directory: web
        run: npx ng test --watch=false --coverage
      - name: install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Playwright report
        working-directory: web
        continue-on-error: true
        run: npm run test:e2e
      - name: build site
        run: node scripts/build-pages.mjs
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
